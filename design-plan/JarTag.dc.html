<!doctype html>
<html>

<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Karla:wght@600&display=swap">
  <style>
    body { margin: 0; background: #f4eee2; color: #3a2712; font-family: 'Cormorant Garamond', Georgia, serif; -webkit-font-smoothing: antialiased; }
    a { color: #5b3d1e; } a:hover { color: #6b7a4a; }
    p { margin: 0; }
  </style>
</helmet>
<div style="width: 240px; height: 336px; box-sizing: border-box; background: #f4eee2; padding: 8px; position: relative;">
  <div style="height: 100%; box-sizing: border-box; border: 1px dashed #a9b18a; padding: 14px 14px 12px; display: flex; flex-direction: column; align-items: center; justify-content: space-between;">
    <div style="width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #5b3d1e; flex: none;"></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <div style="font-family: 'Cinzel', Georgia, serif; font-weight: 700; letter-spacing: 0.2em; font-size: 8px; color: #6b7a4a;">HEAVEN'S HARVEST</div>
      <div style="font-size: 28px; line-height: 0.98; text-align: center; font-weight: 500;">This jar is<br>worth $2.</div>
      <p style="font-size: 12px; line-height: 1.25; text-align: center; color: #6b5a42; font-style: italic;">Bring it back with your next order.</p>
    </div>
    <div style="background: #fff; padding: 4px; border: 1px solid #5b3d1e;"><img src="qr.svg" alt="" style="width: 92px; height: 92px; display: block;"></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <p style="font-size: 11px; font-style: italic; text-align: center; line-height: 1.2; color: #5b3d1e;">"Taste and see that the Lord is good."</p>
      <div style="font-family: 'Cinzel', Georgia, serif; font-weight: 600; letter-spacing: 0.18em; font-size: 7px; color: #6b7a4a;">PSALM 34 : 8</div>
    </div>
  </div>
</div>
</x-dc>
