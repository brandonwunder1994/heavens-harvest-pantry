  <div style="position: absolute; inset: 10px; border: 1px solid #a9b18a; pointer-events: none;"></div>

    <p style="font-family: 'Karla', system-ui, sans-serif; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #6b7a4a; font-weight: 600;">Delivered in Vistancia &amp; Anthem</p>
  </div>
  <img src="qr.svg" alt="" style="width: 190px; height: 190px;">

    <div style="border-top: 1px solid #cdbfa5; padding-top: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 76%;">
      <p style="font-size: 15px; font-style: italic; text-align: center; line-height: 1.2; color: #5b3d1e;">"Taste and see that the Lord is good."</p>
      <div style="font-family: 'Cinzel', Georgia, serif; font-weight: 600; letter-spacing: 0.2em; font-size: 8px; color: #6b7a4a;">PSALM 34 : 8</div>
    </div>
    <p style="font-family: 'Karla', system-ui, sans-serif; font-size: 10px; letter-spacing: 0.12em; color: #8a7a62;">[HERDOMAIN.COM]</p>
  </div>
</div>
